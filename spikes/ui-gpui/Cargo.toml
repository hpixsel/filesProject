# Throwaway M1 spike: validates GPUI + gpui-kit on Windows. Not part of the
# main workspace (own [workspace] table), so CI does not build it.
[package]
name = "ui-gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
gpui-kit = "=0.9.1"
files-win = { path = "../../crates/files-win" }
raw-window-handle = "=0.6.2"
windows-core = "=0.58.0"

[dependencies.windows]
version = "=0.58.0"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
]
