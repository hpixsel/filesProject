[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/hpixsel/filesProject"

[workspace.dependencies]
files-core = { path = "crates/files-core" }
files-win = { path = "crates/files-win" }
files-jobs = { path = "crates/files-jobs" }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
ctrlc = "=3.5.2"
windows = "=0.58.0"
windows-core = "=0.58.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
