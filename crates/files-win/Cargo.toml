[package]
name = "files-win"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
files-core.workspace = true
tracing.workspace = true
windows-core = { workspace = true, optional = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi", # STGMEDIUM and ReleaseStgMedium are gated behind it
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
]

[features]
fake = ["windows/implement", "dep:windows-core"]

[[test]]
name = "virtual_files"
required-features = ["fake"]

[[test]]
name = "clipboard_smoke"
required-features = ["fake"]

# Own table: Cargo cannot combine `workspace = true` with overrides.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
